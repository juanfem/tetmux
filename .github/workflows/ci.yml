name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # For the tmux version matrix, which is too slow to run per push and too valuable to run never.
  # Monday morning, so a week's drift is found before anyone builds on it.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # arm64. The packaged binary is single-architecture, so the runner is also what it is built for.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # XCTest is absent from CommandLineTools, which is what `xcode-select -p` points at by default.
      # Every step below inherits DEVELOPER_DIR from here.
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          swift --version

      # SessionIntegrationTests drives a real tmux server and skips itself when tmux is absent —
      # which on a bare image means the half of the suite that has ever caught a real bug silently
      # does not run. Installing it is what makes this CI worth having.
      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log

      # A skipped test reads exactly like a passing one in a green check, and this suite skips itself
      # by design when tmux is missing — which would quietly retire the half of it that has ever
      # caught a real bug. Fail loudly on that specific cause and report the rest.
      - name: Check the integration tests actually ran
        if: always()
        run: |
          if grep -q "tmux is not installed" test.log; then
            echo "::error::tmux was missing, so the integration suite skipped itself"
            exit 1
          fi
          echo "::notice::$(grep -oE 'Executed [0-9]+ tests, with [0-9]+ failures' test.log | tail -1)"
          if grep -qE "was skipped|skipped \(" test.log; then
            echo "::warning::some tests skipped themselves:"
            grep -B1 -E "was skipped|skipped \(" test.log | tail -20
          fi

  # §2.4: the portability hedge is only a hedge if something exercises it. It had already stopped
  # being true — `PtyTransport` called `Darwin.write` outside any `#if`, and `forkpty` needs libutil
  # on glibc — and nothing caught it, because every job here ran on macOS.
  #
  # Building is not enough on its own: §8 says the fixture replay runs on both platforms, and a
  # library that compiles can still parse differently. `tetmuxCoreTests` exists so that it can —
  # the suite used to be one target linking `tetmuxUI`, which is AppKit and SwiftTerm by design and
  # so cannot be *built* here at all. A failure on a glibc-only difference is the entire point.
  portability:
    name: Test tetmuxCore on Linux
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Build the portable core
        run: swift build --target tetmuxCore
      - name: Replay the fixtures on glibc
        run: swift test --filter tetmuxCoreTests

  # §8's other half: the integration suite against every tmux the SRD names, rather than against the
  # one version a runner happens to install. The fixtures pin what each version *says*; this pins
  # what tetmux *does* about it, which is where the version branches are — per-window sizing below
  # 2.9, `swap-window` reorders below 3.2, pane commands polled below 3.2, no flow control before 3.2.
  #
  # Deliberately **not** on every push. Building five tmuxen from pinned tarballs is minutes of
  # `./configure && make` per version, and the answer only changes when the code under those branches
  # does. It runs weekly, and on demand — which is what a version matrix is actually for: a routine
  # sweep, plus a button to press when you have touched a fallback.
  #
  # The cache is keyed on the version list and the build script, so the tarball fetch and the five
  # builds are paid once. A miss costs the full build; a hit costs a download of the binaries.
  matrix:
    name: Integration suite across the tmux matrix
    # Only the two triggers that mean "sweep now": the weekly cron, and a person pressing the button
    # after touching a version-conditional path. Not pushes, and not pull requests — a PR that waits
    # ten minutes on five tmux builds is a PR nobody runs CI on twice.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      # libevent, ncurses and utf8proc are what tmux needs to build. utf8proc deliberately: it is
      # what decides how wide tmux thinks a character is, so a server built without it would
      # disagree with every real installation about layouts.
      - name: Install tmux build dependencies
        run: brew install libevent ncurses utf8proc

      - name: Cache the built tmuxen
        uses: actions/cache@v4
        with:
          path: .tmux-matrix/bin
          key: tmux-matrix-${{ runner.os }}-${{ hashFiles('Scripts/build-tmux-matrix.sh') }}

      # Builds only what the cache did not restore, then runs the suite once per version, each on a
      # private socket. Fails on the first version that fails, and prints how many tests each one
      # actually ran — a skip is exactly as green as a pass, and old versions are where tests skip.
      - name: Run the matrix
        run: Scripts/test-matrix.sh

  package:
    name: Package .dmg
    needs: test
    runs-on: macos-15
    permissions:
      # Only the tagged path uses this, to create the release the .dmg is attached to.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are what the version comes from, and actions/checkout does not fetch them by default.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build disk image
        id: package
        run: |
          # A tag build is that version; anything else is a dated snapshot, so two artifacts from
          # different commits never claim to be the same build.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.$(date +%Y%m%d)"
          fi
          Scripts/package-dmg.sh --version "$VERSION"
          echo "dmg=$(ls dist/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      # Proves the bundle is more than a correctly-shaped directory: it opens the image, checks the
      # signature the way Gatekeeper does, and runs the app's own diagnostic against a real tmux —
      # which is what catches a resource bundle that did not make it into Contents/Resources.
      - name: Verify the packaged app
        run: |
          brew install tmux
          MOUNT="$(mktemp -d)"
          hdiutil attach "${{ steps.package.outputs.dmg }}" -nobrowse -readonly -mountpoint "$MOUNT"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/tetmux.app"
          "$MOUNT/tetmux.app/Contents/MacOS/tetmux" --diagnose 2>/dev/null | tee diagnose.log
          hdiutil detach "$MOUNT"
          grep -q "state:   connected" diagnose.log || {
            echo "::error::the packaged app could not open a control-mode channel"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: tetmux-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # Tag builds also become a release, so a .dmg is downloadable without digging through a
      # workflow run. Unsigned beyond ad-hoc, which the release notes have to say out loud.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/*.dmg \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --notes "This build is ad-hoc signed, not notarised. macOS will refuse it on first open: right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/tetmux.app\`."
