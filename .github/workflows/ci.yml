name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # For the tmux version matrix, which is too slow to run per push and too valuable to run never.
  # Monday morning, so a week's drift is found before anyone builds on it.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # arm64. The packaged binary is single-architecture, so the runner is also what it is built for.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # XCTest is absent from CommandLineTools, which is what `xcode-select -p` points at by default.
      # Every step below inherits DEVELOPER_DIR from here.
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          swift --version

      # SessionIntegrationTests drives a real tmux server and skips itself when tmux is absent —
      # which on a bare image means the half of the suite that has ever caught a real bug silently
      # does not run. Installing it is what makes this CI worth having.
      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log

      # A skipped test reads exactly like a passing one in a green check, and this suite skips itself
      # by design when tmux is missing — which would quietly retire the half of it that has ever
      # caught a real bug. Fail loudly on that specific cause and report the rest.
      - name: Check the integration tests actually ran
        if: always()
        run: |
          if grep -q "tmux is not installed" test.log; then
            echo "::error::tmux was missing, so the integration suite skipped itself"
            exit 1
          fi
          echo "::notice::$(grep -oE 'Executed [0-9]+ tests, with [0-9]+ failures' test.log | tail -1)"
          if grep -qE "was skipped|skipped \(" test.log; then
            echo "::warning::some tests skipped themselves:"
            grep -B1 -E "was skipped|skipped \(" test.log | tail -20
          fi

  # §2.4: the portability hedge is only a hedge if something exercises it. It had already stopped
  # being true — `PtyTransport` called `Darwin.write` outside any `#if`, and `forkpty` needs libutil
  # on glibc — and nothing caught it, because every job here ran on macOS.
  #
  # Building is not enough on its own: §8 says the fixture replay runs on both platforms, and a
  # library that compiles can still parse differently. `tetmuxCoreTests` exists so that it can —
  # the suite used to be one target linking `tetmuxUI`, which is AppKit and SwiftTerm by design and
  # so cannot be *built* here at all. A failure on a glibc-only difference is the entire point.
  portability:
    name: Test tetmuxCore on Linux
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Build the portable core
        run: swift build --target tetmuxCore
      - name: Replay the fixtures on glibc
        run: swift test --filter tetmuxCoreTests

  # §8's other half: the integration suite against every tmux the SRD names, rather than against the
  # one version a runner happens to install. The fixtures pin what each version *says*; this pins
  # what tetmux *does* about it, which is where the version branches are — per-window sizing below
  # 2.9, `swap-window` reorders below 3.2, pane commands polled below 3.2, no flow control before 3.2.
  #
  # One job per version, in parallel. `Scripts/test-matrix.sh` loops the versions itself and that is
  # right for a laptop, where they share one toolchain build and run one after another; in CI it
  # turns five ~90-second runs into one eight-minute job with a single pass/fail at the end. Here
  # each version gets its own runner, its own cache entry, and its own line in the checks list — so a
  # 3.0 regression says "tmux 3.0" rather than needing the log read. The script is still the single
  # implementation: it takes a version list, and each job passes it one.
  #
  # It costs more machine-minutes than it saves in wall clock, because every job rebuilds the test
  # bundle. That is the trade being made deliberately: this runs weekly and on demand, and the value
  # of on-demand is an answer while you are still looking at it.
  #
  # Deliberately **not** on every push. Building tmux from a pinned tarball is minutes of
  # `./configure && make`, and the answer only changes when the code under those branches does.
  matrix:
    name: tmux ${{ matrix.tmux }}
    # Three triggers that mean "sweep now": the weekly cron, a person pressing the button after
    # touching a version-conditional path, and a tag — which is the only event that produces
    # something a user installs, and so the one where R3.6's compatibility claim is a promise rather
    # than a note. A tag can be cut from a commit the cron has never seen. Not pushes, and not pull
    # requests — a PR that waits on five tmux builds is a PR nobody runs CI on twice.
    #
    # The cache is a 7-day eviction and the cron a 7-day interval, so a tag build will often miss all
    # five entries and pay `./configure && make` for each. Parallel, so that is minutes; accepted.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    strategy:
      # Every version reports. The point of the matrix is *which* versions disagree with the code, and
      # cancelling the other four the moment one fails throws that away — the failure on 3.0 tells you
      # nothing about whether 3.2a is also broken.
      fail-fast: false
      matrix:
        tmux: ["3.0", "3.2a", "3.3a", "3.4", "3.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      # libevent, ncurses and utf8proc are what tmux needs to build. utf8proc deliberately: it is
      # what decides how wide tmux thinks a character is, so a server built without it would
      # disagree with every real installation about layouts.
      - name: Install tmux build dependencies
        run: brew install libevent ncurses utf8proc

      # Per version rather than one entry for all five, so a new version in the list does not
      # invalidate the four that were already built.
      - name: Cache tmux ${{ matrix.tmux }}
        uses: actions/cache@v4
        with:
          path: .tmux-matrix/bin/${{ matrix.tmux }}
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ hashFiles('Scripts/build-tmux-matrix.sh') }}

      # Builds this version if the cache missed, then runs the suite against it on a private socket.
      # The script prints how many tests ran *and* how many skipped, which matters most here: a skip
      # is exactly as green as a pass, and the old versions are where tests decide they do not apply.
      - name: Run the suite against tmux ${{ matrix.tmux }}
        run: Scripts/test-matrix.sh ${{ matrix.tmux }}

  package:
    name: Package .dmg
    needs: [test, matrix]
    # The matrix gates the release rather than merely reporting beside it: publishing a .dmg and
    # *then* going red says the versions disagree after the artifact is already downloadable.
    #
    # The explicit condition is what makes that safe. `matrix` is skipped on an ordinary push, and a
    # skipped dependency skips its dependents by default — so `needs: matrix` alone would stop
    # producing a .dmg everywhere except on tags, silently, since a skipped job is not a failed one
    # and nothing would say why. `success()` is no good either: it is false when anything needed was
    # skipped. Hence naming the two acceptable results outright.
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && (needs.matrix.result == 'success' || needs.matrix.result == 'skipped')
    # **The SDK this links against is what the window looks like**, so the packaging job is pinned to
    # the current OS rather than left on whatever the other jobs use. macOS 26 grants an application
    # the Liquid Glass appearance — rounded window corners, the translucent sidebar material — only
    # when its binary was linked against the macOS 26 SDK; a binary linked against 15.x gets the
    # compatibility look, with square corners and an opaque grey sidebar. Nothing in the source says
    # which, and nothing in the build says it either: 0.3.2 was built on `macos-15`, shipped
    # `LC_BUILD_VERSION sdk 15.5`, and arrived looking like a different application than the one the
    # same commit builds locally. It passed every check, because there is no check that can see it.
    #
    # `Package.swift` pins `.macOS(.v14)`, so this moves the SDK and not the deployment target:
    # `minos` stays 14.0 and `LSMinimumSystemVersion` in the bundle stays honest.
    #
    # `test` and `matrix` stay on `macos-15` deliberately — they assert behaviour, which is the half
    # that does not vary with the SDK, and running them a version behind is free coverage of the
    # older OS. This is the one job whose output somebody installs.
    runs-on: macos-26
    permissions:
      # Only the tagged path uses this, to create the release the .dmg is attached to.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are what the version comes from, and actions/checkout does not fetch them by default.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build disk image
        id: package
        run: |
          # A tag build is that version; anything else is a dated snapshot, so two artifacts from
          # different commits never claim to be the same build.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.$(date +%Y%m%d)"
          fi
          Scripts/package-dmg.sh --version "$VERSION"
          echo "dmg=$(ls dist/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      # The appearance regression above is invisible to every other check in this file: the app
      # launches, connects, signs and verifies identically whichever SDK it was linked against, and
      # the only symptom is that the window is drawn in the previous design language. So the SDK is
      # asserted directly, out of the Mach-O, rather than trusted to the runner label — a runner
      # image that ships an older Xcode, or a `Select Xcode` step that picks one, would put 15.x back
      # with `runs-on` still reading `macos-26` and nothing to say so.
      - name: Assert the binary linked against the current SDK
        run: |
          SDK="$(otool -l .build/release/tetmux | awk '/LC_BUILD_VERSION/,/ntools/ { if ($1 == "sdk") print $2 }' | head -1)"
          echo "linked against macOS SDK $SDK"
          MAJOR="${SDK%%.*}"
          if [[ -z "$MAJOR" || "$MAJOR" -lt 26 ]]; then
            echo "::error::built against macOS SDK ${SDK:-unknown}; macOS 26 grants Liquid Glass only to a binary linked against the 26 SDK, so this .dmg would ship with the compatibility appearance"
            exit 1
          fi

      # Proves the bundle is more than a correctly-shaped directory: it opens the image, checks the
      # signature the way Gatekeeper does, and runs the app's own diagnostic against a real tmux —
      # which is what catches a resource bundle that did not make it into Contents/Resources.
      #
      # `.build` is moved aside first, and that is not tidiness. A binary compiled by SwiftPM carries
      # the absolute path of its own build directory as a fallback for resource lookup, so a check
      # run beside `.build` is asking whether the app works *on the machine that built it* — which is
      # the one machine nobody downloads it to. 0.3.1 passed this step and then aborted on launch for
      # every user. With the directory renamed the runner is standing in for theirs.
      - name: Verify the packaged app
        run: |
          brew install tmux
          mv .build .build-hidden
          trap 'mv .build-hidden .build' EXIT
          MOUNT="$(mktemp -d)"
          hdiutil attach "${{ steps.package.outputs.dmg }}" -nobrowse -readonly -mountpoint "$MOUNT"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/tetmux.app"
          "$MOUNT/tetmux.app/Contents/MacOS/tetmux" --diagnose 2>/dev/null | tee diagnose.log
          hdiutil detach "$MOUNT"
          grep -q "state:   connected" diagnose.log || {
            echo "::error::the packaged app could not open a control-mode channel"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: tetmux-dmg
          path: dist/*.dmg
          if-no-files-found: error

      # Tag builds also become a release, so a .dmg is downloadable without digging through a
      # workflow run. Unsigned beyond ad-hoc, which the release notes have to say out loud.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/*.dmg \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --notes "This build is ad-hoc signed, not notarised. macOS will refuse it on first open: right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine /Applications/tetmux.app\`."
