<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1b1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>tetmux</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<style>
  /* Light by default, dark when the system says so — unless the page was told otherwise (`⋯` →
     Appearance), which sets data-theme on the root. The dark block is written twice because a
     media query cannot be combined with an attribute selector into one rule. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --bar: #f2f2f4;
    --tabs: #f7f7f8;
    --side: #ececef;
    --line: #d8d8dc;
    --sheet: #f2f2f7;
    --row: #ffffff;
    --key: #e2e2e6;
    --key-on: #007aff;
    --fg: #1c1c1e;
    --dim: #6e6e73;
    --ok: #28b14c;
    --wait: #e0b000;
    --bad: #ff3b30;
    --activity: #ff9500;
    --toast: #fde2df;
    --veil: rgba(0, 0, 0, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1b1b1d; --bar: #26262a; --tabs: #212124; --side: #222226; --line: #333338;
      --sheet: #2c2c31; --row: #36363c; --key: #3a3a40; --key-on: #0a84ff; --fg: #e8e8ea;
      --dim: #9a9aa2; --ok: #30d158; --wait: #ffd60a; --bad: #ff453a; --activity: #ff9f0a;
      --toast: #4a2b2b; --veil: rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1b1b1d; --bar: #26262a; --tabs: #212124; --side: #222226; --line: #333338;
    --sheet: #2c2c31; --row: #36363c; --key: #3a3a40; --key-on: #0a84ff; --fg: #e8e8ea;
    --dim: #9a9aa2; --ok: #30d158; --wait: #ffd60a; --bad: #ff453a; --activity: #ff9f0a;
    --toast: #4a2b2b; --veil: rgba(0, 0, 0, .45);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  /* Sized from visualViewport by script, so the key bar sits on top of the iOS keyboard rather
     than behind it. 100% is only the first frame. */
  #app { position: fixed; inset: 0 0 auto 0; height: 100%; display: flex;
    padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  /* F4.38 — a remote host's colour, as on the Mac: the host's name as a chip, and a band under the
     top bar. The band is a shadow, not a border, so it takes no height from the terminal and a
     colour coming or going is not a resize. On an installed page the status bar is translucent over
     #app's top padding, so that strip takes the colour too: the Mac's band, where a phone has
     room for one. */
  #app.remote { background: var(--host); }
  #app.remote #top { box-shadow: inset 0 -3px 0 var(--host); }
  .chip { display: inline-block; padding: 0 7px; border-radius: 999px; color: #fff; font-weight: 600;
    font-size: 12px; line-height: 18px; vertical-align: 1px; }
  .hostdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .node.host .name { flex: 0 1 auto; }
  .node.host .plus { margin-left: auto; }

  /* The sidebar: hosts, their sessions, each session's windows — the Mac's tree. Only where there is
     room for it beside a terminal; a phone keeps the host button and its sheet. */
  #side { display: none; width: 240px; flex: none; flex-direction: column; background: var(--side);
    border-right: 1px solid var(--line); font-size: 13px; user-select: none; }
  #toggle { display: none; padding: 3px 7px; min-width: 0; background: transparent; color: var(--dim); }
  #toggle svg { display: block; }
  @media (min-width: 760px) {
    #side { display: flex; }
    #toggle { display: block; }
    #app.collapsed #side { display: none; }
  }
  #tree { flex: 1; overflow-y: auto; padding: 8px 6px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;
    cursor: default; white-space: nowrap; }
  .node:hover { background: var(--key); }
  .node.on { background: var(--key-on); color: #fff; }
  .node.on .count { color: rgba(255, 255, 255, .75); }
  .node .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .node .disc { width: 12px; flex: none; color: var(--dim); text-align: center; font-size: 10px;
    transition: transform .12s; }
  .node .disc.open { transform: rotate(90deg); }
  .node.on .disc { color: inherit; }
  .node .state { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--wait); }
  .node.ok .state { background: var(--ok); }
  .node.bad .state { background: var(--bad); }
  .node.host { font-weight: 600; margin-top: 6px; }
  .node.host:first-child { margin-top: 0; }
  .node.session { padding-left: 20px; }
  .node.window { padding-left: 52px; }
  .node .count { color: var(--dim); font-size: 11px; }
  .node .plus { padding: 0 6px; min-width: 0; background: transparent; color: var(--dim);
    visibility: hidden; font-weight: 600; }
  .node:hover .plus { visibility: visible; }
  .node.window.activity .name::before { content: ""; display: inline-block; width: 6px; height: 6px;
    margin-right: 5px; border-radius: 50%; background: var(--activity); vertical-align: middle; }
  .why { color: var(--dim); font-size: 11px; padding: 0 6px 4px 38px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #side-add { margin: 6px; text-align: left; background: transparent; color: var(--dim);
    padding: 6px 8px; }
  #side-add:hover { background: var(--key); color: var(--fg); }

  /* A mouse and a real keyboard need none of the keys iOS lacks. */
  @media (hover: hover) and (pointer: fine) {
    #keys { display: none !important; }
  }
  button, input { font: inherit; color: var(--fg); border: 0; border-radius: 6px; }
  button { background: var(--key); padding: 8px 11px; min-width: 40px; flex: none;
    touch-action: manipulation; }
  button.on { background: var(--key-on); }

  #top { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--bar);
    font-size: 13px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; }
  .ok { --state: var(--ok); }
  .bad { --state: var(--bad); }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--bad); }
  #where { flex: 0 1 auto; min-width: 0; max-width: 60%; padding: 4px 10px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #note { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #more { padding: 3px 10px; min-width: 0; font-weight: 600; }

  /* Two rows of tabs: the session's windows, then the panes of the window being shown. A phone has
     room for one pane, so a split is a choice between panes rather than a layout. */
  .tabs { display: flex; gap: 4px; padding: 4px 6px; background: var(--tabs); overflow-x: auto;
    flex: none; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs[hidden] { display: none; }
  .tabs button { padding: 5px 10px; min-width: 0; max-width: 45vw; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; background: transparent; color: var(--dim); }
  .tabs button.on { background: var(--key); color: var(--fg); }
  .tabs button.activity::before { content: ""; display: inline-block; width: 6px; height: 6px;
    margin-right: 5px; border-radius: 50%; background: var(--activity); vertical-align: middle; }
  .tabs button.add { color: var(--fg); font-weight: 600; }
  #panes { padding-top: 0; }
  #panes button { font-size: 12px; padding: 3px 9px; }

  /* tmux owns the grid (§3.3). When another client owns the window's size the grid can be larger
     than the screen, and then it pans rather than reflowing. */
  #term { flex: 1; min-height: 0; overflow: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
  #keys { display: flex; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: var(--bar); overflow-x: auto; flex: none; }

  /* Sheets: the host list and the actions on what is shown. Drawn inside #app so they follow the
     keyboard the same way the key bar does. */
  #veil { position: absolute; inset: 0; background: var(--veil); display: flex;
    flex-direction: column; justify-content: flex-end; z-index: 10; }
  #veil[hidden] { display: none; }
  #sheet { background: var(--sheet); border-radius: 14px 14px 0 0; max-height: 85%; overflow-y: auto;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  #sheet h2 { font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase;
    letter-spacing: .04em; margin: 14px 4px 6px; display: flex; align-items: center; gap: 8px; }
  #sheet h2:first-child { margin-top: 4px; }
  #sheet h2 .state { width: 8px; height: 8px; border-radius: 50%; background: var(--state, var(--wait)); }
  #sheet h2 .why { text-transform: none; letter-spacing: 0; font-weight: 400; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: block; width: 100%; text-align: left; background: var(--row); margin: 0 0 4px;
    padding: 11px 12px; border-radius: 8px; }
  .row.on { background: var(--key-on); }
  .row.danger { color: var(--bad); }
  .row.danger.on { background: var(--bad); color: #fff; }
  .row .sub { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .pair { display: flex; gap: 4px; }
  .pair .row { flex: 1; text-align: center; }
  .form { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .form input { flex: 1 1 140px; min-width: 0; background: var(--bg); padding: 10px; }
  .form input.short { flex: 0 1 80px; }
  .form button { background: var(--key-on); }
  .hint { color: var(--dim); font-size: 12px; margin: 2px 4px 8px; }
  .warn { margin: 4px 4px 10px; line-height: 1.4; }
  /* On a wide screen a sheet across the whole width reads as a mistake: centred, as a dialog. */
  @media (min-width: 760px) {
    #veil { justify-content: center; align-items: center; }
    #sheet { width: 460px; max-height: 80%; border-radius: 14px; padding-bottom: 12px; }
  }

  #toast { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 44px);
    background: var(--toast); color: var(--fg); padding: 10px 12px; border-radius: 8px; z-index: 20;
    font-size: 13px; line-height: 1.35; }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<div id="app">
  <nav id="side" aria-label="Hosts and sessions">
    <div id="tree" role="tree"></div>
    <button id="side-add">Add a host…</button>
  </nav>
  <div id="main">
  <div id="top">
    <button id="toggle" aria-label="Toggle sidebar" title="Toggle sidebar (⌃⌘S)">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="0.7" y="0.7" width="16.6" height="12.6" rx="2.5"/><line x1="6.2" y1="0.7" x2="6.2" y2="13.3"/>
      </svg>
    </button>
    <span id="dot"></span>
    <button id="where" aria-label="Hosts and sessions">connecting…</button>
    <span id="note"></span>
    <button id="more" aria-label="Actions">⋯</button>
  </div>
  <div id="windows" class="tabs" role="tablist" aria-label="Windows"></div>
  <div id="panes" class="tabs" role="tablist" aria-label="Panes" hidden></div>
  <div id="term"></div>
  <div id="keys">
    <button data-key="esc">esc</button>
    <button data-key="ctrl" id="ctrl">ctrl</button>
    <button data-key="tab">tab</button>
    <button data-key="left" aria-label="Left">←</button>
    <button data-key="down" aria-label="Down">↓</button>
    <button data-key="up" aria-label="Up">↑</button>
    <button data-key="right" aria-label="Right">→</button>
    <button data-text="|">|</button>
    <button data-text="~">~</button>
    <button data-text="/">/</button>
    <button data-text="-">-</button>
  </div>
  </div>
  <div id="veil" hidden><div id="sheet" role="dialog"></div></div>
  <div id="toast" role="status" hidden></div>
</div>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('token') || '';
  const $ = (id) => document.getElementById(id);
  const storage = {
    get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };

  // ---- appearance ---------------------------------------------------------------------------------

  // `system`, `light` or `dark`. The chrome follows through CSS; the emulator draws on a canvas
  // that CSS cannot reach, so it is told separately, and again whenever the system flips.
  let appearance = storage.get('appearance', 'system');
  const darkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  const isDark = () => appearance === 'dark' || (appearance === 'system' && !!(darkQuery && darkQuery.matches));
  // Light is the Mac's System scheme in light mode: black on white. Dark keeps xterm's own colours
  // on the page's background. The ANSI slots are xterm.js's defaults in both.
  const terminalTheme = () => isDark()
    ? { background: '#1b1b1d' }
    : { background: '#ffffff', foreground: '#000000', cursor: '#000000', cursorAccent: '#ffffff',
        selectionBackground: 'rgba(0, 122, 255, .25)' };

  // F4.38 — the Mac's swatches (`HostColorStyle.swift`), by the name the relay sends. White text
  // reads on every one in both appearances, which is why they do not change with it.
  const hostColors = {
    blue: '#2563c9', teal: '#0d7a6f', green: '#2f7d32', ochre: '#8a6a00', orange: '#b4530a',
    purple: '#7c3aed', pink: '#be185d', graphite: '#52525b', red: '#c0262d',
  };
  const hostColor = (host) => (host && hostColors[host.color]) || null;
  const hostDot = (host) => hostColor(host)
    ? el('span', { class: 'hostdot', style: `background: ${hostColor(host)}` }) : null;
  // The colour of the host whose pane is on screen: what the band and the browser's chrome speak
  // for. The chip follows the name beside it, which can be a host still connecting.
  let shownColor = null;
  function applyHostColor(color) {
    if (color === shownColor) return;
    shownColor = color;
    $('app').classList.toggle('remote', !!color);
    if (color) $('app').style.setProperty('--host', color);
    else $('app').style.removeProperty('--host');
    applyChrome();
  }

  function applyChrome() {
    if (appearance === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = appearance;
    document.querySelector('meta[name="theme-color"]').content =
      shownColor || (isDark() ? '#1b1b1d' : '#f2f2f4');
  }
  function applyAppearance() {
    applyChrome();
    term.options.theme = terminalTheme();
  }
  function setAppearance(value) {
    appearance = value;
    storage.set('appearance', value);
    applyAppearance();
  }
  if (darkQuery) darkQuery.addEventListener('change', () => { if (appearance === 'system') applyAppearance(); });
  applyChrome();

  let fontSize = Number(storage.get('fontSize', '12')) || 12;
  const term = new Terminal({
    fontSize,
    fontFamily: 'Menlo, "SF Mono", ui-monospace, monospace',
    scrollback: 5000,
    cursorBlink: true,
    theme: terminalTheme(),
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('term'));

  // iOS would otherwise capitalise the first letter of every command and "correct" flags.
  function plain(input) {
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('autocorrect', 'off');
    input.setAttribute('autocomplete', 'off');
    input.spellcheck = false;
    return input;
  }
  if (term.textarea) plain(term.textarea);

  // ---- what is being shown ------------------------------------------------------------------------

  // `topology` is the relay's last snapshot; `shown` is the pane it last said it is streaming.
  // `asked` is the last thing this page asked for, which differs from `shown` while a host it picked
  // is still connecting — the sheet shows the request, the terminal keeps the old pane meanwhile.
  let topology = { hosts: [] };
  let shown = null;
  let asked = null;
  try { asked = JSON.parse(storage.get('view', 'null')); } catch {}

  function view(target) {
    asked = target;
    storage.set('view', JSON.stringify(target));
    send({ t: 'view', ...target });
    render();
  }

  const findHost = (id) => topology.hosts.find((h) => h.id === id);
  const findSession = (host, id) => host && host.sessions.find((s) => s.id === id);
  const findWindow = (session, id) => session && session.windows.find((w) => w.id === id);

  function current() {
    const host = shown && findHost(shown.host);
    const session = findSession(host, shown && shown.session);
    const win = findWindow(session, shown && shown.window);
    return { host, session, win };
  }

  function render() {
    const { host, session, win } = current();
    const wanted = findHost((asked && asked.host) || (shown && shown.host)) || host;
    const where = $('where');
    where.textContent = '';
    if (wanted) {
      const color = hostColor(wanted);
      where.append(color ? el('span', { class: 'chip', style: `background: ${color}` }, wanted.name) : wanted.name);
      if (wanted === host && session) where.append(` · ${session.name}`);
    } else {
      where.textContent = 'hosts';
    }
    applyHostColor(hostColor(host));

    renderTabs($('windows'), session ? session.windows : [], shown && shown.window,
      (w) => w.label, (w) => w.activity, session ? '+' : null);
    const panes = win ? win.panes : [];
    $('panes').hidden = panes.length < 2;
    renderTabs($('panes'), panes.length < 2 ? [] : panes, shown && shown.pane,
      (p) => p.label, () => false, null);

    const up = wanted && wanted.state === 'connected';
    if (ws && ws.readyState === WebSocket.OPEN) setDot(up ? 'ok' : '');
    let note = '';
    if (wanted && wanted.prompt) note = 'ssh is waiting — tap the host';
    else if (wanted && !up) note = wanted.note || `${wanted.state}…`;
    else if (wanted && wanted.note) note = wanted.note;
    $('note').textContent = note;

    // Each failure tmux reported is shown once.
    for (const h of topology.hosts) {
      if (h.failure && !seenFailures.has(h.failure.id)) {
        seenFailures.add(h.failure.id);
        toast(h.failure.text);
      }
    }
    renderTree();
    if (sheet) sheet.draw();
  }
  const seenFailures = new Set();

  // ---- the sidebar --------------------------------------------------------------------------------

  // Which rows are open, by `h:<host>` and `s:<host>:<session>` — session ids collide across hosts.
  // A host is open unless closed; a session is closed unless opened, except the one on screen.
  let expanded = {};
  try { expanded = JSON.parse(storage.get('tree', '{}')) || {}; } catch {}
  const hostOpen = (h) => expanded[`h:${h.id}`] !== false;
  const sessionOpen = (h, s) => expanded[`s:${h.id}:${s.id}`]
    ?? (!!shown && shown.host === h.id && shown.session === s.id);
  function setOpen(key, open) {
    expanded[key] = open;
    storage.set('tree', JSON.stringify(expanded));
    renderTree();
  }

  let collapsed = storage.get('sidebar', 'shown') === 'hidden';
  function setCollapsed(value) {
    collapsed = value;
    storage.set('sidebar', value ? 'hidden' : 'shown');
    $('app').classList.toggle('collapsed', value);
    askForSize();
  }
  $('app').classList.toggle('collapsed', collapsed);
  $('toggle').addEventListener('click', () => { setCollapsed(!collapsed); term.focus(); });
  // ⌃⌘S, the Mac's own Toggle Sidebar — taken before the emulator turns it into a keystroke.
  term.attachCustomKeyEventHandler((event) => {
    if (event.type === 'keydown' && event.metaKey && event.ctrlKey && event.code === 'KeyS') {
      event.preventDefault();
      setCollapsed(!collapsed);
      return false;
    }
    return true;
  });

  // Rebuilt whole, like the tabs, and only when something it draws changed. The row marked is what
  // the page is showing, at whichever depth is on screen: the window, or its session when that is
  // closed — as in the Mac's sidebar.
  function renderTree() {
    const tree = $('tree');
    const hosts = topology.hosts.map(({ failure, ...h }) => h);
    const signature = JSON.stringify([hosts, shown, expanded]);
    if (tree.dataset.signature === signature) return;
    tree.dataset.signature = signature;
    tree.textContent = '';

    for (const host of topology.hosts) {
      const up = host.state === 'connected';
      const open = up && hostOpen(host);
      tree.append(el('div', {
        class: `node host ${up ? 'ok' : host.state === 'failed' ? 'bad' : ''}`,
        role: 'treeitem', title: host.note || host.state,
      }, el('span', { class: `disc ${open ? 'open' : ''}` }, up ? '▶' : ''),
        el('span', { class: 'state' }),
        el('span', { class: 'name' }, host.name),
        hostDot(host),
        up ? el('button', { class: 'plus', title: 'New session', 'aria-label': 'New session' }, '+') : null));
      Object.assign(tree.lastChild.dataset, { act: 'host', host: host.id });
      tree.lastChild.setAttribute('aria-expanded', String(open));
      if (tree.lastChild.querySelector('.plus')) tree.lastChild.querySelector('.plus').dataset.act = 'newSession';

      const why = host.prompt ? 'ssh is waiting — click to answer'
        : !up ? (host.note || (host.state === 'disconnected' ? 'click to connect' : `${host.state}…`))
        : host.note;
      if (why) tree.append(el('div', { class: 'why', title: why }, why));
      if (!open) continue;

      for (const session of host.sessions) {
        const sOpen = sessionOpen(host, session);
        const here = shown && shown.host === host.id && shown.session === session.id;
        const node = el('div', { class: `node session ${here && !sOpen ? 'on' : ''}`, role: 'treeitem' },
          el('span', { class: `disc ${sOpen ? 'open' : ''}` }, '▶'),
          el('span', { class: 'name' }, session.name),
          el('span', { class: 'count' }, String(session.windows.length)));
        Object.assign(node.dataset, { act: 'session', host: host.id, session: session.id });
        node.querySelector('.disc').dataset.act = 'toggleSession';
        node.setAttribute('aria-expanded', String(sOpen));
        tree.append(node);
        if (!sOpen) continue;

        for (const win of session.windows) {
          const on = here && shown.window === win.id;
          const row = el('div', {
            class: `node window ${on ? 'on' : ''} ${win.activity && !on ? 'activity' : ''}`,
            role: 'treeitem', title: win.label,
          }, el('span', { class: 'name' }, win.label));
          Object.assign(row.dataset, { act: 'window', host: host.id, session: session.id, window: win.id });
          tree.append(row);
        }
      }
    }
  }

  // Clicking the tree must not take focus from the terminal, or typing after a switch goes nowhere.
  $('side').addEventListener('mousedown', (event) => event.preventDefault());
  $('tree').addEventListener('click', (event) => {
    const target = event.target.closest('[data-act]');
    if (!target) return;
    const node = target.closest('.node');
    const { host: hostId, session, window } = node.dataset;
    const host = findHost(hostId);
    if (!host) return;
    switch (target.dataset.act) {
      case 'newSession':
        send({ t: 'newSession', host: hostId, name: '' });
        break;
      case 'host':
        if (host.prompt) { openHosts(); return; }
        if (host.state !== 'connected') view({ host: hostId });
        else setOpen(`h:${hostId}`, !hostOpen(host));
        break;
      case 'toggleSession': {
        const s = findSession(host, session);
        if (s) setOpen(`s:${hostId}:${session}`, !sessionOpen(host, s));
        break;
      }
      case 'session':
        view({ host: hostId, session });
        break;
      case 'window':
        view({ host: hostId, session, window });
        break;
    }
    term.focus();
  });
  $('side-add').addEventListener('click', () => openHosts());

  // Rebuilt from scratch each time — a few dozen buttons at most — but only when something on them
  // changed, so a tab row the thumb is scrolling does not jump back under it.
  function renderTabs(row, items, selected, label, activity, add) {
    const signature = JSON.stringify([items.map((i) => [i.id, label(i), activity(i)]), selected, add]);
    if (row.dataset.signature === signature) return;
    row.dataset.signature = signature;
    row.textContent = '';
    for (const item of items) {
      const button = document.createElement('button');
      button.dataset.id = item.id;
      button.textContent = label(item);
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-selected', String(item.id === selected));
      if (item.id === selected) button.classList.add('on');
      if (activity(item) && item.id !== selected) button.classList.add('activity');
      row.appendChild(button);
    }
    if (add) {
      const button = document.createElement('button');
      button.className = 'add';
      button.dataset.action = 'newWindow';
      button.textContent = add;
      button.setAttribute('aria-label', 'New window');
      row.appendChild(button);
    }
    const on = row.querySelector('.on');
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  // A tab acts on click, not pointerdown, so starting a swipe along the row does not switch tabs.
  // mousedown's default is what moves focus; preventing it keeps the iOS keyboard up across a tap.
  for (const row of [$('windows'), $('panes')]) {
    row.addEventListener('mousedown', (event) => event.preventDefault());
  }
  $('windows').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || !shown) return;
    if (button.dataset.action === 'newWindow') { send({ t: 'newWindow' }); return; }
    view({ host: shown.host, session: shown.session, window: button.dataset.id });
  });
  $('panes').addEventListener('click', (event) => {
    const id = event.target.closest('button')?.dataset.id;
    if (!id || !shown) return;
    view({ host: shown.host, session: shown.session, window: shown.window, pane: id });
  });

  // ---- sheets -------------------------------------------------------------------------------------

  // One sheet at a time. `draw` is called again on every topology change, so a host that connects
  // while its sheet is open shows its sessions without being reopened. Inputs survive a redraw only
  // because a sheet holding one stops redrawing (`typing`).
  let sheet = null;

  function openSheet(draw) {
    sheet = { draw: () => { if (!sheet.typing) { $('sheet').textContent = ''; draw($('sheet')); } } };
    $('veil').hidden = false;
    sheet.draw();
  }
  function closeSheet() {
    sheet = null;
    $('veil').hidden = true;
    $('sheet').textContent = '';
    term.focus();
  }
  $('veil').addEventListener('click', (event) => { if (event.target === $('veil')) closeSheet(); });
  $('sheet').addEventListener('focusin', () => { if (sheet) sheet.typing = true; });

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === 'on') node.addEventListener('click', value);
      else if (key === 'class') node.className = value;
      else if (key === 'role' || key.includes('-')) node.setAttribute(key, value);
      else node[key] = value;
    }
    for (const child of children) if (child != null) node.append(child);
    return node;
  }
  const row = (text, on, cls = '', sub = null) =>
    el('button', { class: `row ${cls}`, on }, text, sub ? el('span', { class: 'sub' }, sub) : null);

  function form(fields, label, submit) {
    const inputs = fields.map((f) => plain(el('input', { placeholder: f.placeholder, type: f.type || 'text',
      class: f.short ? 'short' : '', inputMode: f.mode || 'text', value: f.value || '' })));
    const go = () => submit(...inputs.map((i) => i.value.trim()));
    for (const input of inputs) {
      input.addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); go(); } });
    }
    return { node: el('div', { class: 'form' }, ...inputs, el('button', { on: go }, label)), inputs };
  }

  // Hosts, each with its sessions; what ssh is waiting on; adding a host.
  $('where').addEventListener('click', () => openHosts());
  const openHosts = () => openSheet((root) => {
    const at = asked && asked.host ? asked : shown;
    for (const host of topology.hosts) {
      const up = host.state === 'connected';
      root.append(el('h2', { class: up ? 'ok' : host.state === 'failed' ? 'bad' : '' },
        el('span', { class: 'state' }), host.name, hostDot(host),
        el('span', { class: 'why' }, up ? (host.note || '') : (host.note || host.state))));

      if (host.prompt) {
        root.append(el('div', { class: 'warn' }, host.prompt.text));
        const answer = form([{ placeholder: host.prompt.secret ? 'answer (hidden)' : 'answer',
          type: host.prompt.secret ? 'password' : 'text' }], 'Send', (value) => {
          send({ t: 'answer', host: host.id, d: value });
          sheet.typing = false;
          sheet.draw();
        });
        root.append(answer.node, row('Give up on this connection', () => send({ t: 'cancelPrompt', host: host.id }), 'danger'));
        continue;
      }
      if (!up) {
        root.append(row(host.state === 'connecting' ? 'Connecting…' : 'Connect',
          () => { view({ host: host.id }); closeSheet(); }));
        continue;
      }
      for (const session of host.sessions) {
        const on = at && at.host === host.id && at.session === session.id;
        root.append(row(session.name, () => { view({ host: host.id, session: session.id }); closeSheet(); },
          on ? 'on' : '', `${session.windows.length} window${session.windows.length === 1 ? '' : 's'}`));
      }
      root.append(row('New session…', (event) => {
        const create = form([{ placeholder: 'name (optional)' }], 'Create', (name) => {
          send({ t: 'newSession', host: host.id, name });
          closeSheet();
        });
        event.currentTarget.replaceWith(create.node);
        sheet.typing = true;
        create.inputs[0].focus();
      }));
    }

    root.append(el('h2', {}, 'Add a host'));
    const add = form([
      { placeholder: 'user@host' },
      { placeholder: 'port', short: true, mode: 'numeric' },
      { placeholder: 'name (optional)' },
    ], 'Add', (destination, port, name) => {
      if (!destination) return;
      send({ t: 'addHost', destination, port: port ? Number(port) : undefined, name: name || undefined });
      closeSheet();
    });
    root.append(add.node, el('div', { class: 'hint' },
      'Connects over ssh from the server, with the server\'s keys. Saved to its hosts.json.'));
  });

  // What can be done to the pane and window on screen.
  $('more').addEventListener('click', () => openSheet((root) => {
    const { host, session, win } = current();
    if (win && session) {
      const multi = win.panes.length > 1;
      root.append(el('h2', {}, win.label));
      root.append(el('div', { class: 'pair' },
        row('Split →', () => { send({ t: 'split', dir: 'right' }); closeSheet(); }),
        row('Split ↓', () => { send({ t: 'split', dir: 'down' }); closeSheet(); })));
      root.append(row('New window', () => { send({ t: 'newWindow' }); closeSheet(); }));
      root.append(row('Rename window…', (event) => {
        const rename = form([{ placeholder: 'name', value: win.label }], 'Rename', (name) => {
          if (name) send({ t: 'renameWindow', host: host.id, window: win.id, name });
          closeSheet();
        });
        event.currentTarget.replaceWith(rename.node);
        sheet.typing = true;
        rename.inputs[0].focus();
        rename.inputs[0].select();
      }));
      if (multi) root.append(row('Close pane', () => { send({ t: 'closePane' }); closeSheet(); }, 'danger'));
      // F4.9/F4.10: the relay's ClosePolicy said whether this only removes the window from this
      // session (no question) or ends what runs in it (asked, with the Mac's sentence).
      root.append(row('Close window', (event) => {
        if (win.close !== 'kill') {
          send({ t: 'closeWindow', host: host.id, session: session.id, window: win.id });
          closeSheet();
          return;
        }
        const ask = el('div', {},
          el('div', { class: 'warn' }, win.closeText),
          el('div', { class: 'pair' },
            row('Cancel', closeSheet),
            row('Close', () => {
              send({ t: 'closeWindow', host: host.id, session: session.id, window: win.id, confirm: true });
              closeSheet();
            }, 'danger on')));
        event.currentTarget.replaceWith(ask);
        sheet.typing = true;
      }, 'danger'));
    }
    root.append(el('h2', {}, `Text size ${fontSize}`));
    root.append(el('div', { class: 'pair' },
      row('A−', () => { setFont(fontSize - 1); sheet.draw(); }),
      row('A+', () => { setFont(fontSize + 1); sheet.draw(); })));
    root.append(el('h2', {}, 'Appearance'));
    root.append(el('div', { class: 'pair' }, ...[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']]
      .map(([value, label]) => row(label, () => { setAppearance(value); sheet.draw(); },
        appearance === value ? 'on' : ''))));
  }));

  let toastTimer = null;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 5000);
  }
  $('toast').addEventListener('click', () => { $('toast').hidden = true; });

  // ---- the socket -------------------------------------------------------------------------------

  let ws = null;
  let retry = 0;
  let retryTimer = null;

  function send(message) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
  }

  function connect() {
    clearTimeout(retryTimer);
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${scheme}://${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws.binaryType = 'arraybuffer';
    setDot('');
    ws.onopen = () => {
      retry = 0;
      lastAsked = null;
      // The relay shows nothing until it is told what to show: where this page was, or — the first
      // time — nothing in particular, which it answers with the first host that is up.
      send({ t: 'view', ...(asked || shown || {}) });
      askForSize();
    };
    ws.onmessage = (event) => {
      if (typeof event.data !== 'string') {
        term.write(new Uint8Array(event.data));
        return;
      }
      const message = JSON.parse(event.data);
      if (message.t === 'pane') {
        // A new stream: whatever the emulator holds belongs to another pane, or to before the link
        // dropped. The repaint that follows starts from a clean screen.
        term.reset();
        adopt(message.cols, message.rows);
        shown = { host: message.host, session: message.session, window: message.window, pane: message.pane };
        // What the relay settled on is what to come back to — unless the request was for a host that
        // is still connecting, and this is the old one being re-shown meanwhile.
        if (!asked || !asked.host || asked.host === message.host) asked = null;
        storage.set('view', JSON.stringify(shown));
        render();
        lastAsked = null;
        askForSize();
      } else if (message.t === 'size') {
        adopt(message.cols, message.rows);
      } else if (message.t === 'topology') {
        topology = message;
        render();
      } else if (message.t === 'notice') {
        toast(message.text);
      }
    };
    ws.onclose = () => {
      setDot('bad');
      // Backed off, but short: the usual cause is iOS having suspended the page, and the user is
      // looking at it again by the time this fires.
      const delay = Math.min(10000, 500 * 2 ** retry++);
      retryTimer = setTimeout(connect, delay);
    };
  }

  // Coming back to the page is the moment the link is most likely dead and most wanted.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { retry = 0; connect(); }
  });
  window.addEventListener('pageshow', () => connect());

  function setDot(state) { $('dot').className = state; }

  // ---- geometry (§3.3: ask, then lay out what tmux answers) ---------------------------------------

  let lastAsked = null;
  let sizeTimer = null;

  function adopt(cols, rows) {
    if (cols > 0 && rows > 0 && (cols !== term.cols || rows !== term.rows)) term.resize(cols, rows);
  }

  function askForSize() {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(() => {
      const d = fit.proposeDimensions();
      if (!d || !(d.cols > 1) || !(d.rows > 1)) return;
      const key = `${d.cols}x${d.rows}`;
      if (key === lastAsked) return;
      lastAsked = key;
      send({ t: 'resize', cols: d.cols, rows: d.rows });
    }, 120);
  }

  function setFont(size) {
    fontSize = Math.max(8, Math.min(24, size));
    storage.set('fontSize', String(fontSize));
    term.options.fontSize = fontSize;
    askForSize();
  }

  // Installed on the Home Screen, with the status bar translucent, iOS reports a viewport that is
  // short by the status bar: `visualViewport.height` and `innerHeight` both stop that far above the
  // bottom of a screen the page is in fact drawn to the edge of, and the key bar floated over a
  // strip of nothing. `100vh` is the one length that is right there, so a probe that tall says how
  // much is missing. Only standalone: in a Safari tab `100vh` includes the space under the toolbars.
  // The shortfall is taken with the keyboard down (the tallest viewport seen at this width) and
  // never more than the top inset, so a keyboard that is up is not mistaken for missing screen.
  const standalone = navigator.standalone === true
    || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100vh;box-sizing:border-box;'
    + 'padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  let tallest = { width: 0, height: 0 };

  function shortfall(vv) {
    if (!standalone) return 0;
    if (vv.width !== tallest.width) tallest = { width: vv.width, height: 0 };
    tallest.height = Math.max(tallest.height, vv.height);
    const inset = parseFloat(getComputedStyle(probe).paddingTop) || 0;
    return Math.max(0, Math.min(probe.offsetHeight - tallest.height, inset));
  }

  function layout() {
    const vv = window.visualViewport;
    const app = $('app');
    app.style.height = `${vv ? vv.height + shortfall(vv) : window.innerHeight}px`;
    app.style.transform = vv ? `translateY(${vv.offsetTop}px)` : '';
    askForSize();
  }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', layout);
    visualViewport.addEventListener('scroll', layout);
  }
  window.addEventListener('resize', layout);
  // The pane row comes and goes with the window being shown, which changes the terminal's height
  // without the viewport changing at all.
  if (window.ResizeObserver) new ResizeObserver(() => askForSize()).observe($('term'));

  // ---- input --------------------------------------------------------------------------------------

  let ctrl = false;
  function setCtrl(on) { ctrl = on; $('ctrl').classList.toggle('on', on); }

  function withCtrl(data) {
    if (data.length !== 1) return data;
    if (data === ' ') return '\x00';
    if (data === '?') return '\x7f';
    const code = data.toUpperCase().charCodeAt(0);
    return code >= 64 && code <= 95 ? String.fromCharCode(code - 64) : data;
  }

  term.onData((data) => {
    if (ctrl) { data = withCtrl(data); setCtrl(false); }
    send({ t: 'in', d: data });
  });

  // A paste goes to tmux as a paste, so bracketed-paste markers are tmux's to add (T5.4) and a long
  // one travels through a buffer rather than as keystrokes.
  term.element.addEventListener('paste', (event) => {
    const text = event.clipboardData && event.clipboardData.getData('text/plain');
    if (!text) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    send({ t: 'paste', d: text });
  }, true);

  const keys = {
    esc: () => '\x1b',
    tab: () => '\t',
    up: () => arrow('A'),
    down: () => arrow('B'),
    right: () => arrow('C'),
    left: () => arrow('D'),
  };
  function arrow(letter) {
    return (term.modes && term.modes.applicationCursorKeysMode ? '\x1bO' : '\x1b[') + letter;
  }

  // pointerdown + preventDefault keeps focus in the terminal, so tapping a key does not dismiss the
  // iOS keyboard.
  for (const button of document.querySelectorAll('#keys button')) {
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (button.dataset.key === 'ctrl') { setCtrl(!ctrl); term.focus(); return; }
      let data = button.dataset.text ?? keys[button.dataset.key]();
      if (ctrl) { data = withCtrl(data); setCtrl(false); }
      send({ t: 'in', d: data });
      term.focus();
    });
  }

  layout();
  connect();
  term.focus();
})();
</script>
</body>
</html>
